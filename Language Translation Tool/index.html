<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Translation Tool</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <span class="material-icons-round brand-icon">translate</span>
        <h1 class="brand-name">LinguaSwift</h1>
      </div>
      <div class="header-actions">
        <button id="historyBtn" class="icon-btn" title="Translation History">
          <span class="material-icons-round">history</span>
        </button>
        <button id="themeToggle" class="icon-btn" title="Toggle Dark Mode">
          <span class="material-icons-round">dark_mode</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="main">

    <!-- Language Selector Bar -->
    <div class="lang-bar card">
      <div class="lang-select-wrap">
        <label class="lang-label" for="sourceLang">From</label>
        <select id="sourceLang" class="lang-select"></select>
      </div>

      <button id="swapBtn" class="swap-btn" title="Swap languages">
        <span class="material-icons-round">swap_horiz</span>
      </button>

      <div class="lang-select-wrap">
        <label class="lang-label" for="targetLang">To</label>
        <select id="targetLang" class="lang-select"></select>
      </div>
    </div>

    <!-- Translation Panels -->
    <div class="panels">

      <!-- Source Panel -->
      <div class="panel card" id="sourcePanel">
        <div class="panel-header">
          <span class="panel-title">Source Text</span>
          <div class="panel-actions">
            <button class="action-btn" id="speakSourceBtn" title="Listen">
              <span class="material-icons-round">volume_up</span>
            </button>
            <button class="action-btn" id="copySourceBtn" title="Copy">
              <span class="material-icons-round">content_copy</span>
            </button>
            <button class="action-btn danger" id="clearBtn" title="Clear">
              <span class="material-icons-round">close</span>
            </button>
          </div>
        </div>
        <textarea
          id="sourceText"
          class="text-area"
          placeholder="Enter text to translate…"
          maxlength="5000"
          spellcheck="true"
        ></textarea>
        <div class="panel-footer">
          <span id="charCount" class="char-count">0 / 5000</span>
        </div>
      </div>

      <!-- Target Panel -->
      <div class="panel card" id="targetPanel">
        <div class="panel-header">
          <span class="panel-title">Translation</span>
          <div class="panel-actions">
            <span id="confidenceBadge" class="confidence-badge" style="display:none;"></span>
            <button class="action-btn" id="speakTargetBtn" title="Listen">
              <span class="material-icons-round">volume_up</span>
            </button>
            <button class="action-btn" id="copyTargetBtn" title="Copy">
              <span class="material-icons-round">content_copy</span>
            </button>
          </div>
        </div>
        <div id="translatedText" class="translated-area" aria-live="polite">
          <span class="placeholder-hint">Your translation will appear here…</span>
        </div>
        <div class="panel-footer">
          <span id="translationStatus" class="status-text"></span>
        </div>
      </div>
    </div>

    <!-- Translate Button -->
    <div class="translate-btn-wrap">
      <button id="translateBtn" class="translate-btn">
        <span class="material-icons-round">translate</span>
        <span class="btn-label">Translate</span>
        <span class="loader" id="loader"></span>
      </button>
    </div>

    <!-- Quick Language Chips -->
    <div class="quick-langs">
      <span class="quick-label">Quick switch target:</span>
      <div class="chips" id="quickChips"></div>
    </div>

  </main>

  <!-- ===== HISTORY DRAWER ===== -->
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="historyDrawer">
    <div class="drawer-header">
      <h2 class="drawer-title">Translation History</h2>
      <button class="icon-btn" id="closeDrawerBtn">
        <span class="material-icons-round">close</span>
      </button>
    </div>
    <div id="historyList" class="history-list">
      <p class="empty-history">No history yet. Translate something!</p>
    </div>
    <button id="clearHistoryBtn" class="clear-history-btn">
      <span class="material-icons-round">delete_sweep</span> Clear History
    </button>
  </aside>

  <!-- ===== TOAST ===== -->
  <div id="toast" class="toast" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
